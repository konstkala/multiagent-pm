# The backend image is built once and used by two services below.
x-backend: &backend
  image: pm-backend:dev
  build: ./backend
  environment:
    # Inside the compose network services are reached by name, not localhost.
    DATABASE_URL: postgresql+asyncpg://pm:pm@db:5432/pm
    SMTP_HOST: mailpit

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
      POSTGRES_DB: pm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Fake inbox for development: every email the app sends shows up at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web inbox

  # One-off job: apply migrations, then exit. Same pattern as a Kubernetes Job.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
