# The backend image is built once and used by two services below.
x-backend: &backend
  image: pm-backend:dev
  build: ./backend
  # Secrets such as ANTHROPIC_API_KEY come from backend/.env at runtime, never baked into the
  # image. Values under `environment` below win, so container addresses stay correct.
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    # Inside the compose network services are reached by name, not localhost.
    DATABASE_URL: postgresql+asyncpg://pm:pm@db:5432/pm
    SMTP_HOST: mailpit
    S3_ENDPOINT_URL: http://storage:8333
    # Trust X-Forwarded-For from any address. Fine here: the only callers are our own proxy and
    # this machine. In production, list only the proxy's address and don't publish the API port.
    FORWARDED_ALLOW_IPS: "*"
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
      POSTGRES_DB: pm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Fake inbox for development: every email the app sends shows up at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web inbox

  # S3-compatible object storage for attachments (SeaweedFS). Production uses S3 or R2 instead.
  # Development keys only: infra/seaweedfs/s3.json.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-off job: apply migrations, then exit. Same pattern as a Kubernetes Job.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy

  # Runs background jobs (AI agents, emails later). Same image as the API, different command.
  # `docker compose up -d --scale worker=3` runs three in parallel; SKIP LOCKED keeps them apart.
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # The image's health check calls the API's /health; a worker serves no HTTP.
    healthcheck:
      disable: true
    # A job in progress gets time to finish after SIGTERM before Docker kills the process.
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy

  # The app people use: http://localhost:3000. It proxies /api to the api service.
  web:
    image: pm-web:dev
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storagedata:
