# Checks that run on your machine before each commit, so problems never reach a push.
# Once per clone: `uv tool install pre-commit==4.6.2` then `pre-commit install`.
# CI runs the same tools, so skipping these (git commit --no-verify) only delays the failure.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe] # only parse: compose's !reset tag is valid Compose, not plain YAML
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^frontend/src/lib/api/ # generated

  # Same ruff version as backend/uv.lock, so the hook and CI agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
