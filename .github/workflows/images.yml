# Builds the two images once per commit on main (and per version tag), publishes them to
# GitHub's container registry, scans them, and signs where they came from. Any environment
# later deploys these exact images by tag; nothing is rebuilt per environment.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false # a half-published release is worse than a slower one

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: frontend
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in token: no stored registry password
      id-token: write # sign the provenance with GitHub's OIDC identity
      attestations: write
      security-events: write # upload the vulnerability report
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # sha-abc1234 on every build (what you deploy); main follows the branch;
          # 1.2.3 and 1.2 for version tags.
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
          sbom: true # a list of every package inside, stored next to the image
      - name: Vulnerability report (all HIGH and CRITICAL, for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.75.0
          # Vulnerabilities only: gitleaks covers secrets in our code, and secret rules match
          # docstring examples inside third-party packages (false positives).
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true # SARIF ignores `severity` without this
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.name }}
      - name: Fail on a CRITICAL vulnerability that has a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.75.0
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true # installed by the step above
      - name: Provenance (verify with `gh attestation verify oci://IMAGE@DIGEST -R OWNER/REPO`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
