# Lives at the repo root so pytest works from here and from backend/.
[pytest]
pythonpath = backend
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    db: needs Postgres (docker compose up -d db)
    llm: calls the real Claude API and costs money
    model: loads the real embedding model (downloads it on first use)
    storage: needs the S3-compatible storage service (docker compose up -d storage)
addopts = -m "not llm and not model and not storage"
